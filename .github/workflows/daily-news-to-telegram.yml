name: Daily news to Telegram

on:
  schedule:
    # 23:45 UTC = 07:45 Asia/Taipei (next day)
    - cron: "45 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run send-news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RSS_URL_GENERAL: ${{ vars.RSS_URL_GENERAL }}
          RSS_URL_AI: ${{ vars.RSS_URL_AI }}
          RSS_URL_CHANGHUA: ${{ vars.RSS_URL_CHANGHUA }}
          MAX_ITEMS_PER_FEED: ${{ vars.MAX_ITEMS_PER_FEED }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update news state [skip ci]"
          git push
